[package]
name = "bc-blog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

# Bounded Context: blog — posts, summaries and the persistence port.
#
# Dependency rules:
#  - YES: shared-kernel, async-trait, thiserror, serde.
#  - NO:  tokio, axum, sqlx, any concrete client/runtime.
#
# PostgreSQL is reached through the `BlogRepository` port, implemented in the
# binary crate (apps/backend).
[dependencies]
shared-kernel = { path = "../shared-kernel" }
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
