# Builds the site image (Dockerfile) and publishes it to GitHub Packages
# (GHCR) as ghcr.io/<owner>/kenespartadev:latest and :<short sha>.
#
# No secrets to configure: uses the workflow's own GITHUB_TOKEN
# (packages: write).
#
# NOTE: this only publishes the image. Deployment (e.g. App Runner) is not
# performed here; the tf/ infrastructure still points at ECR. Point your
# deploy target at the published GHCR image when you are ready.
#
# After the FIRST push the package is created private: make it public on the
# package page (Package settings -> Change visibility) if your deploy target
# needs to pull it without credentials.
name: publish-image

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths-ignore:
      - "**.md"
      - "tf/**"
  workflow_dispatch:

# If two pushes land in a row, the older build is no longer interesting.
concurrency:
  group: publish-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kenespartadev

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # The Rust + Leptos build (SSR + wasm) is slow on the standard runner.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA for the tag
        id: sha
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
          # Links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
