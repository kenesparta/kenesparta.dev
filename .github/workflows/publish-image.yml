name: publish-image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths-ignore:
      - "**.md"
      - "tf/**"
  workflow_dispatch:

# If two pushes land in a row, the older build is no longer interesting.
concurrency:
  group: publish-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kenespartadev

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # The Rust + Leptos build (SSR + wasm) is slow on the standard runner.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA for the tag
        id: sha
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
          # Links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Once the image is on GHCR, tell Lightsail to redeploy (re-pull :latest).
  # Lightsail doesn't watch the registry, so this step is what makes a push
  # actually deploy to production.
  deploy-lightsail:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC: AssumeRoleWithWebIdentity
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Trigger Lightsail redeploy (re-pull :latest)
        env:
          SERVICE: kenesparta-app
        run: |
          set -euo pipefail
          # Re-submit the CURRENT container spec so Lightsail creates a new
          # deployment that re-pulls the freshly-pushed :latest image. The env
          # values (incl. DynamoDB keys) round-trip in the runner's memory and
          # are never printed (create output is filtered to just the state).
          spec=$(aws lightsail get-container-service-deployments \
            --service-name "$SERVICE" --region us-east-1 --output json)
          containers=$(echo "$spec" | jq -c '.deployments[0].containers')
          endpoint=$(echo "$spec" | jq -c '.deployments[0].publicEndpoint | {containerName, containerPort, healthCheck}')
          state=$(aws lightsail create-container-service-deployment \
            --service-name "$SERVICE" --region us-east-1 \
            --containers "$containers" --public-endpoint "$endpoint" \
            --query 'containerService.nextDeployment.state' --output text)
          echo "Lightsail deployment iniciado: $state"
