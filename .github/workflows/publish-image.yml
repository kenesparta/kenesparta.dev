# On every vX.Y.Z tag: build the backend image and push it to GHCR as both
# vX.Y.Z and latest. That IS the whole deploy — the host's systemd timer
# (personal-infra-deploy@blog, see personal-infra spec AD-5) polls GHCR every
# 10 minutes and runs `docker compose pull && up -d`, so moving `latest` is
# what makes a release go live. Nothing here touches AWS: no ECR, no OIDC
# role, no Terraform (personal-infra spec AD-10, Phase 5).
#
# Publish a version (signed, annotated — the repo sets tag.gpgSign, and a tag
# ruleset guards v*; SECURITY.md SEC-008):
#   git tag v1.0.0 -m v1.0.0 && git push origin v1.0.0

# Actions are pinned to full commit SHAs, never to tags (SECURITY.md SEC-003):
# a tag can be moved to a malicious commit by whoever controls the action's
# repo — which, for the publish workflow, would be a direct path to production.
# The trailing comment is the release the SHA was taken from; Dependabot
# (.github/dependabot.yml) bumps both together. The repository setting
# "require SHA pinning" rejects any workflow that regresses to a tag.
name: publish-image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# One build at a time; a half-superseded `latest` helps nobody.
concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push to ghcr.io with GITHUB_TOKEN

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kenespartadev

jobs:
  build-push:
    runs-on: ubuntu-latest
    # The Rust + Leptos build (SSR + wasm) is slow on the standard runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push to GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          # No build cache, deliberately. This workflow only runs on tags, and
          # Actions caches are ref-scoped: each run wrote its cache under
          # refs/tags/vX.Y.Z, which the next tag's run can never restore from.
          # Measured on v0.4.1: ~205s per run (40% of the build) spent exporting
          # 3.2GB for 0 cache hits — the log showed 525 `Compiling` lines either
          # way. Reinstating a cache is only worth it alongside a cacheable
          # dependency layer (cargo-chef): today `COPY . .` sits above the cargo
          # build, so the only restorable layers are the rustup target and
          # cargo-leptos installs, ~7s combined.
          # Links the ghcr package to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
