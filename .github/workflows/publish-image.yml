# On every vX.Y.Z tag: build the backend image, push it to the private ECR
# repository `kenespartadev` as vX.Y.Z, wait for ECR's scan of that
# digest (personal-infra SEC-11), then then point the Lambda
# function `blog` at the digest just pushed (personal-infra spec AD-18, §5.21).
# A pushed tag alone deploys nothing: a function holds a digest and never pulls
# again (personal-infra G48), so the last step IS the deploy. Schema changes
# are not applied here: `make blog/publish` runs the migrations, before a
# release that needs them (SECURITY.md SEC-025).
#
# AWS access is an OIDC role, `github-actions-ecr-push-kenespartadev`, whose
# trust accepts only this repository's refs/tags/v* and whose policy can push
# to that one ECR repository and update that one function, nothing else. No long-lived AWS key exists:
# the only repository secret is the role's ARN (AWS_ECR_PUSH_ROLE_ARN). The
# registry host comes from amazon-ecr-login's `registry` output, so the
# account id is never written into this repo. No Terraform runs here.
#
# Publish a version (signed, annotated — the repo sets tag.gpgSign, and a tag
# ruleset guards v*; SECURITY.md SEC-008):
#   git tag v1.0.0 -m v1.0.0 && git push origin v1.0.0

# Actions are pinned to full commit SHAs, never to tags (SECURITY.md SEC-003):
# a tag can be moved to a malicious commit by whoever controls the action's
# repo — which, for the publish workflow, would be a direct path to production.
# The trailing comment is the release the SHA was taken from; Dependabot
# (.github/dependabot.yml) bumps both together. The repository setting
# "require SHA pinning" rejects any workflow that regresses to a tag.
name: publish-image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# One build at a time; a half-superseded `latest` helps nobody.
concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC token for the ECR push role

env:
  ECR_REPOSITORY: kenespartadev

jobs:
  build-push:
    runs-on: ubuntu-latest
    # The Rust + Leptos build (SSR + wasm) is slow on the standard runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # ECR Public too, so the build pulls the Lambda Web Adapter as an
      # authenticated user: anonymous pulls share a monthly quota per address,
      # which GitHub's runners exhaust ("toomanyrequests: Data limit exceeded").
      - name: Login to ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push to ECR
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          # A single image manifest, not an index: buildx's default provenance
          # and SBOM attestations turn the push into an OCI image index, which
          # Lambda refuses (personal-infra G49).
          provenance: false
          sbom: false
          # The registry host is the login step's output, not a literal; like
          # every value here it reaches the action as an input, never a shell.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          # The home-page footer's release stamp (Dockerfile ARGs). ref_name is
          # the tag this run was triggered by, which the `on:` filter limits
          # to vX.Y.Z; both go in as action inputs, never through a shell.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_BUILD=${{ github.sha }}
          # No build cache, deliberately. This workflow only runs on tags, and
          # Actions caches are ref-scoped: each run wrote its cache under
          # refs/tags/vX.Y.Z, which the next tag's run can never restore from.
          # Measured on v0.4.1: ~205s per run (40% of the build) spent exporting
          # 3.2GB for 0 cache hits — the log showed 525 `Compiling` lines either
          # way. Reinstating a cache is only worth it alongside a cacheable
          # dependency layer (cargo-chef): today `COPY . .` sits above the cargo
          # build, so the only restorable layers are the rustup target and
          # cargo-leptos installs, ~7s combined.
          # OCI provenance metadata: the repository this image was built from.
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}

      # The scan gate (personal-infra SEC-11): ECR's basic scan of the pushed
      # digest must report no critical or high finding, or nothing is deployed.
      # ECR registers the scan a moment after the push returns, and the waiter
      # fails at once on ScanNotFoundException, so wait for it to exist first.
      - name: Gate on ECR's scan of the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for _ in $(seq 30); do
            aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" \
              --image-id "imageDigest=$DIGEST" --max-items 1 > /dev/null 2>&1 && break
            sleep 2
          done
          aws ecr wait image-scan-complete --repository-name "$ECR_REPOSITORY" --image-id "imageDigest=$DIGEST"
          findings="$(aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=$DIGEST" --no-paginate --output json)"
          jq -e --arg d "$DIGEST" '.imageId.imageDigest == $d and .imageScanStatus.status == "COMPLETE"' \
            <<< "$findings" > /dev/null || { echo "::error::ECR did not complete the scan of $DIGEST"; exit 1; }
          echo "ECR $DIGEST: $(jq -c '.imageScanFindings.findingSeverityCounts // {}' <<< "$findings")"
          jq -e '(.imageScanFindings.findingSeverityCounts // {}) | ((.CRITICAL // 0) + (.HIGH // 0)) == 0' \
            <<< "$findings" > /dev/null || { echo "::error::the image has critical or high findings: nothing is deployed"; exit 1; }

      # The deploy (personal-infra §5.21, G48). By digest, never by tag, so the
      # function runs exactly what this run built. The digest is a build-push
      # output, passed through env: rather than interpolated into the script.
      - name: Deploy to Lambda
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
          FUNCTION_NAME: blog
        run: |
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --image-uri "$IMAGE_URI" \
            --query '[FunctionName,LastUpdateStatus]' --output text
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          resolved=$(aws lambda get-function --function-name "$FUNCTION_NAME" --query 'Code.ResolvedImageUri' --output text)
          echo "the function runs $resolved"
          [ "${resolved##*@}" = "$DIGEST" ] || { echo "::error::Lambda resolved ${resolved##*@}, not $DIGEST"; exit 1; }

      # `latest` moves last, once the function runs the scanned digest: a
      # recreated function starts from it (personal-infra G48), so an image the
      # gate refused is never `latest`.
      - name: Move latest to the deployed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" --image-ids "imageDigest=$DIGEST" --output json)"
          manifest="$(jq -r '.images[0].imageManifest' <<< "$image")"
          media="$(jq -r '.images[0].imageManifestMediaType' <<< "$image")"
          if ! out="$(aws ecr put-image --repository-name "$ECR_REPOSITORY" --image-tag latest \
              --image-digest "$DIGEST" --image-manifest "$manifest" --image-manifest-media-type "$media" 2>&1)"; then
            grep -q ImageAlreadyExistsException <<< "$out" || { echo "$out" >&2; exit 1; }
          fi
          echo "latest -> $DIGEST"
