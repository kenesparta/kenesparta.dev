# On every vX.Y.Z tag: build the backend image and push it to the private ECR
# repository `kenespartadev` as both vX.Y.Z and latest. That IS the whole
# deploy — the host's systemd timer (personal-infra-deploy@blog, see
# personal-infra spec AD-5) polls ECR every 10 minutes and runs
# `docker compose pull && up -d` on `:latest`, so moving `latest` is what makes
# a release go live (personal-infra spec AD-15, §5.18).
#
# AWS access is an OIDC role, `github-actions-ecr-push-kenespartadev`, whose
# trust accepts only this repository's refs/tags/v* and whose policy can push
# to that one ECR repository and nothing else. No long-lived AWS key exists:
# the only repository secret is the role's ARN (AWS_ECR_PUSH_ROLE_ARN). The
# registry host comes from amazon-ecr-login's `registry` output, so the
# account id is never written into this repo. No Terraform runs here.
#
# Publish a version (signed, annotated — the repo sets tag.gpgSign, and a tag
# ruleset guards v*; SECURITY.md SEC-008):
#   git tag v1.0.0 -m v1.0.0 && git push origin v1.0.0

# Actions are pinned to full commit SHAs, never to tags (SECURITY.md SEC-003):
# a tag can be moved to a malicious commit by whoever controls the action's
# repo — which, for the publish workflow, would be a direct path to production.
# The trailing comment is the release the SHA was taken from; Dependabot
# (.github/dependabot.yml) bumps both together. The repository setting
# "require SHA pinning" rejects any workflow that regresses to a tag.
name: publish-image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# One build at a time; a half-superseded `latest` helps nobody.
concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC token for the ECR push role

env:
  ECR_REPOSITORY: kenespartadev

jobs:
  build-push:
    runs-on: ubuntu-latest
    # The Rust + Leptos build (SSR + wasm) is slow on the standard runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push to ECR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          # The registry host is the login step's output, not a literal; like
          # every value here it reaches the action as an input, never a shell.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # The home-page footer's release stamp (Dockerfile ARGs). ref_name is
          # the tag this run was triggered by, which the `on:` filter limits
          # to vX.Y.Z; both go in as action inputs, never through a shell.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_BUILD=${{ github.sha }}
          # No build cache, deliberately. This workflow only runs on tags, and
          # Actions caches are ref-scoped: each run wrote its cache under
          # refs/tags/vX.Y.Z, which the next tag's run can never restore from.
          # Measured on v0.4.1: ~205s per run (40% of the build) spent exporting
          # 3.2GB for 0 cache hits — the log showed 525 `Compiling` lines either
          # way. Reinstating a cache is only worth it alongside a cacheable
          # dependency layer (cargo-chef): today `COPY . .` sits above the cargo
          # build, so the only restorable layers are the rustup target and
          # cargo-leptos installs, ~7s combined.
          # OCI provenance metadata: the repository this image was built from.
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
