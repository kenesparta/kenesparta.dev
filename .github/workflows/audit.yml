name: audit

on:
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  # New advisories appear without any code change: re-audit weekly.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prebuilt binary (installing via cargo would compile for minutes).
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Reads the documented ignores from .cargo/audit.toml; fails on any
      # non-ignored vulnerability in Cargo.lock.
      - name: Run cargo audit
        run: cargo audit
