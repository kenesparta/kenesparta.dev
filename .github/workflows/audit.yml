# Actions are pinned to full commit SHAs, never to tags (SECURITY.md SEC-003):
# a tag can be moved to a malicious commit by whoever controls the action's
# repo — which, for the publish workflow, would be a direct path to production.
# The trailing comment is the release the SHA was taken from; Dependabot
# (.github/dependabot.yml) bumps both together. The repository setting
# "require SHA pinning" rejects any workflow that regresses to a tag.
name: audit

on:
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  # New advisories appear without any code change: re-audit weekly.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Prebuilt binary (installing via cargo would compile for minutes).
      - name: Install cargo-audit
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-audit

      # Fails on any vulnerability and — SECURITY.md SEC-007 — on yanked or
      # unsound crates, which only warned before and let a yanked `spin` ship
      # in the release binary. `unmaintained` stays a warning: the two today
      # (paste, proc-macro-error2) come through leptos and are not ours to fix.
      # If an advisory ever has to be ignored, put it in .cargo/audit.toml with
      # the reason and a SEC entry; do not loosen these flags.
      - name: Run cargo audit
        run: cargo audit --deny yanked --deny unsound
