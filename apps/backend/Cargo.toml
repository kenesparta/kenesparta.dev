[package]
name = "backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# UI Leptos: compiled to wasm for hydration and native for SSR.
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
serde.workspace = true
chrono.workspace = true

# Bounded Context. Its domain is pure data, so it compiles to wasm too and the
# UI can use its DTOs directly (no view-model duplication). Only the concrete
# adapters and wiring below are server-only.
bc-blog = { path = "../../crates/bc-blog" }

# Hydration-only (wasm artifact).
console_error_panic_hook = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

# Server-only (feature `ssr`): runtime, HTTP and the DynamoDB adapter.
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }

[features]
default = []
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:async-trait",
    "dep:aws-config",
    "dep:aws-sdk-dynamodb",
]

[package.metadata.leptos]
output-name = "kenespartadev"
site-root = "target/kdevsite"
site-pkg-dir = "pkg"
style-file = "style/global.scss"
assets-dir = "public"
site-addr = "0.0.0.0:3000"
reload-port = 3001
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
browserquery = "defaults"
env = "DEV"
wasm-opt = true

bin-features = ["ssr"]
bin-default-features = false

lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
