services:
  kenespartadev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kenespartadev
    ports:
      # Local smoke test only — loopback (SECURITY.md SEC-009).
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - app-network
    # No healthcheck: the distroless runtime has no curl, no shell, nothing to
    # probe with — the old curl-based check reported "unhealthy" forever.
    # Health in production is CloudFront/Caddy's concern (personal-infra).

networks:
  app-network:
    driver: bridge